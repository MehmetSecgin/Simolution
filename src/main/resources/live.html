<!doctype html><html><head><meta charset="utf-8">
<title>Simolution · live</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#06080c; --panel:#0b0f16; --panel2:#0e131c; --line:#1a2230;
    --ink:#c9d3df; --ink-bright:#eaf2ff; --muted:#5d6b80;
    --sensor:#35d6c8; --internal:#9d8cff; --action:#f5b73f;
    --pos:#2ee6a8; --neg:#ff6f61;
  }
  *{box-sizing:border-box}
  body{ background:
      radial-gradient(1200px 600px at 22% -10%, #0f1a24 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #16101f 0%, transparent 50%),
      var(--bg);
    color:var(--ink); font:13px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,monospace; margin:0; padding:22px 26px;
    letter-spacing:.2px; }
  h1{ font-size:13px; font-weight:600; letter-spacing:.34em; text-transform:uppercase; color:var(--muted);
    margin:0 0 18px; display:flex; align-items:center; gap:12px; }
  h1 .dot{ width:7px;height:7px;border-radius:50%; background:var(--pos); box-shadow:0 0 10px var(--pos); }
  .badge{ font-size:10.5px; letter-spacing:.18em; padding:3px 10px; border-radius:2px; border:1px solid var(--line); }
  .badge.live{ color:#9affc9; border-color:#1f6f3d; background:#0c1b12; }
  .badge.ended{ color:#9fb0c4; }
  .wrap{ display:flex; gap:22px; flex-wrap:wrap; align-items:flex-start; }
  canvas{ background:#000; image-rendering:pixelated; border:1px solid var(--line); border-radius:3px; cursor:crosshair;
    box-shadow:0 0 0 1px #000, 0 18px 50px -28px #000; }
  .col{ background:linear-gradient(180deg,var(--panel) 0%, var(--panel2) 100%); border:1px solid var(--line);
    border-radius:5px; padding:13px 14px; }
  .stack{ display:flex; flex-direction:column; gap:14px; }
  .row{ display:flex; align-items:center; gap:10px; margin:7px 0 }
  button{ background:#121925; color:var(--ink); border:1px solid var(--line); border-radius:3px; padding:6px 13px;
    font:inherit; letter-spacing:.1em; cursor:pointer; text-transform:uppercase; font-size:11px; }
  button:hover{ background:#19222f; border-color:#28344a; }
  input[type=range]{ flex:1; accent-color:var(--pos) }
  label{ color:var(--muted); user-select:none }
  .lab{ font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--muted); margin:0 0 9px; }
  .kv{ color:var(--muted) } .kv b{ color:var(--ink-bright); font-weight:600 }
  .glist{ max-height:340px; overflow:auto; margin:-4px -4px 0; padding:0 4px }
  .glist::-webkit-scrollbar{width:8px} .glist::-webkit-scrollbar-thumb{background:#1c2636;border-radius:8px}
  .grow{ display:flex; align-items:center; gap:9px; padding:6px 8px; cursor:pointer; border-radius:3px;
    border:1px solid transparent; font-size:12px; }
  .grow:hover{ background:#121a26 } .grow.sel{ background:#10212f; border-color:#1f4a63; }
  .sw{ width:10px;height:10px;border-radius:2px;flex:none; box-shadow:0 0 7px -1px currentColor }
  .grow .n{ color:var(--ink-bright); font-weight:600; min-width:38px }
  .grow .fp{ color:var(--muted); font-size:11px } .grow .meta{ color:#74849a; font-size:11px; margin-left:auto }
  #stage{ flex:1 1 560px; min-width:520px; }
  .circwrap{ position:relative; background:
      repeating-linear-gradient(0deg, transparent 0 23px, #0c131c80 23px 24px),
      repeating-linear-gradient(90deg, transparent 0 23px, #0c131c80 23px 24px),
      radial-gradient(700px 380px at 50% 30%, #0c1620 0%, #070a0f 70%);
    border:1px solid var(--line); border-radius:6px; overflow:hidden;
    box-shadow:inset 0 0 90px -30px #000, 0 22px 60px -34px #000; }
  .scan{ position:absolute; inset:0; pointer-events:none; opacity:.5;
    background:repeating-linear-gradient(0deg, #ffffff05 0 2px, transparent 2px 4px); }
  .empty{ color:var(--muted); padding:60px 20px; text-align:center; letter-spacing:.1em }
  .statbar{ display:flex; flex-wrap:wrap; gap:8px 16px; margin:0 0 12px; font-size:12px }
  .statbar .pill{ color:var(--muted) } .statbar .pill b{ color:var(--ink-bright); font-weight:600 }
  .statbar .pill.dead{ color:var(--neg) }
  .legend{ display:flex; gap:16px; flex-wrap:wrap; margin:11px 2px 2px; font-size:10.5px; color:var(--muted);
    letter-spacing:.08em; text-transform:uppercase }
  .legend i{ display:inline-block; width:18px; height:0; border-top-width:3px; border-top-style:solid; vertical-align:middle; margin-right:6px; border-radius:2px }
  /* circuit dynamics: an edge is .active when it carries signal this tick, a node .fire when it outputs */
  .edge .base{ stroke-opacity:.20; transition:stroke-opacity .12s }
  .edge.active .base{ stroke-opacity:.9; filter:url(#glow) }
  .edge.junk .base{ stroke-opacity:.30 }
  .edge .flow{ stroke-opacity:0 }
  .edge.active .flow{ stroke-opacity:.95; animation:flow 1.25s linear infinite }
  /* hover a node -> its connections become .hot -> reveal their actual weights */
  .wlabel{ opacity:0; pointer-events:none; transition:opacity .1s } .edge.hot .wlabel{ opacity:1 }
  .node-box rect{ transition:.12s } .node-box .nt{ transition:.12s }
  .node-box.fire rect{ filter:url(#glow); stroke-width:2.4 } .node-box.fire .nt{ fill:#f4faff }
  svg.dim .edge, svg.dim .node-box{ opacity:.14 } svg.dim .edge.hot, svg.dim .node-box.hot{ opacity:1 }
  svg.idle{ filter:grayscale(.75); opacity:.4 }
  @keyframes flow{ to{ stroke-dashoffset:-1 } }
  @keyframes svgin{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:none } }
  .circ-svg{ display:block; width:100%; height:auto; animation:svgin .45s cubic-bezier(.2,.7,.2,1) }
</style></head><body>
<h1><span class="dot"></span> SIMOLUTION · LIVE LATTICE <span id="badge" class="badge live">connecting…</span></h1>
<div class="wrap">
  <div class="stack">
    <canvas id="cv" width="640" height="640"></canvas>
    <div class="col" style="width:100%">
      <div class="row"><label><input type="checkbox" id="follow" checked> follow live</label>
        <label style="margin-left:auto"><input type="checkbox" id="showres" checked> resource</label></div>
      <div class="row"><input id="slider" type="range" min="0" max="0" value="0"></div>
      <div class="row"><button id="play">&#9654; replay</button><span id="meta" class="kv"></span></div>
      <div class="row kv">tick <b id="tick">–</b> · frame <b id="frame">0</b>/<span id="last">0</span> · alive <b id="alive">0</b> · lineages <b id="lin">0</b></div>
    </div>
  </div>

  <div class="col" style="width:268px">
    <div class="lab">alive distinct genomes</div>
    <div class="row kv" style="margin-top:-2px">alive <b id="galive">0</b> · distinct <b id="gdistinct">0</b></div>
    <div id="glist" class="glist"></div>
  </div>

  <div id="stage">
    <div class="lab" style="display:flex;align-items:center;gap:14px">genome circuit <span id="dsel" style="color:var(--muted)"></span>
      <label style="margin-left:auto;text-transform:none;letter-spacing:0;font-size:11px;color:var(--muted)"><input type="checkbox" id="hidejunk" checked> hide junk</label></div>
    <div class="statbar" id="statbar"></div>
    <div class="circwrap"><div class="scan"></div><div id="detail"><div class="empty">click a unit on the map (or a genome) &middot; signal flows left &rarr; right</div></div></div>
    <div class="legend">
      <span><i style="border-color:var(--pos)"></i>excite (+)</span>
      <span><i style="border-color:var(--neg)"></i>inhibit (&minus;)</span>
      <span><i style="border-color:#39435a;border-top-style:dashed"></i>junk</span>
      <span>&mdash; bright + flow = carrying signal this tick &middot; dim = silent</span>
    </div>
  </div>
</div>
<script>
// ---- node layout: mirrors com.simolution.kernel.layout.NodeLayout ----
// TOTAL=22 : 6 sensors, 8 internals, 8 actions; trailing entries per block = junk.
const NAMES=["CONST","RAND","LOCAL_RESOURCE","SELF_ENERGY","JUNK-S4","JUNK-S5",
             "ADD","MUL","CLAMP","DELAY","THRESH","JUNK-I5","JUNK-I6","JUNK-I7",
             "ACTION_Y","HARVEST","REPRODUCE","MOVE_N","MOVE_S","MOVE_E","MOVE_W","JUNK-A7"];
const SENS_TC=6,INT_TC=8,ACT_TC=8,WMUL=4.0/32767,MAXW=4.0;
const meaningful=(i)=> i<6 ? i<4 : (i<14 ? (i-6)<5 : (i-14)<7);
const kindOf=(i)=> i<6?0 : (i<14?1:2);
// mirrors GeneDecoder.decode: [SrcType:1|SrcID:7|DstType:1|DstID:7|Weight:16]
function decodeGene(raw){
  const g=raw|0, srcId=(g>>>24)&0x7f, dstId=(g>>>16)&0x7f, sB=(g>>>31)&1, dB=(g>>>23)&1;
  let w=g&0xffff; if(w&0x8000) w-=0x10000;
  const src=sB===0?(srcId%SENS_TC):(6+(srcId%INT_TC));
  const dst=dB===0?(6+(dstId%INT_TC)):(14+(dstId%ACT_TC));
  return {src,dst,w:w*WMUL,junk:!(meaningful(src)&&meaningful(dst))};
}

let W=0,px=6,every=1;
const frames=[];
let idx=0,done=false,showRes=true,replaying=false,selSlot=null,renderedKey=null,hideJunk=true;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),$=(id)=>document.getElementById(id);

function linColor(id){ return `hsl(${(id*137.508)%360},72%,60%)`; }
function resColor(l){ const t=l/9; return `rgb(${Math.round(t*16)},${Math.round(22+t*112)},${Math.round(t*48)})`; }
function fmtW(v){ return (v>=0?'+':'')+v.toFixed(2); }
function hashKey(s){ let h=0; for(let i=0;i<s.length;i++) h=(Math.imul(h,31)+s.charCodeAt(i))|0; return (h>>>0).toString(16).padStart(8,'0').slice(0,6); }
function sizeCanvas(){ px=Math.max(2,Math.floor(640/W)); cv.width=W*px; cv.height=W*px; }
function curFrame(){ return frames.length?frames[Math.min(idx,frames.length-1)]:null; }
function selUnit(f){ return selSlot===null?null:f.units.find(u=>u.slot===selSlot); }

function groupGenomes(f){
  const g=new Map();
  for(const u of f.units){ const k=u.genes.join(','); let a=g.get(k); if(!a){a={key:k,n:0,rep:u};g.set(k,a);} a.n++; }
  return g;
}

function draw(){
  const f=curFrame(); if(!f) return;
  if(showRes){ const r=f.r; for(let c=0;c<r.length;c++){ ctx.fillStyle=resColor(r.charCodeAt(c)-48); ctx.fillRect((c%W)*px,((c/W)|0)*px,px,px);} }
  else{ ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height); }
  const lin=new Set();
  for(const u of f.units){ ctx.fillStyle=linColor(u.lineage); ctx.fillRect((u.cell%W)*px,((u.cell/W)|0)*px,px,px); lin.add(u.lineage); }
  $('tick').textContent=f.t; $('frame').textContent=idx; $('last').textContent=frames.length-1;
  $('alive').textContent=f.units.length; $('lin').textContent=lin.size;
  $('slider').max=Math.max(0,frames.length-1); $('slider').value=idx;
  renderGenomes(f); renderDetail(f);
}

function renderGenomes(f){
  const groups=[...groupGenomes(f).values()].sort((a,b)=>b.n-a.n);
  const u=selUnit(f), selK=u?u.genes.join(','):null;
  $('galive').textContent=f.units.length; $('gdistinct').textContent=groups.length;
  const list=$('glist'); list.innerHTML='';
  for(const g of groups){
    const r=g.rep, el=document.createElement('div');
    el.className='grow'+(g.key===selK?' sel':'');
    el.innerHTML=`<span class="sw" style="background:${linColor(r.lineage)};color:${linColor(r.lineage)}"></span>`+
      `<span class="n">×${g.n}</span><span class="fp">${hashKey(g.key)}</span>`+
      `<span class="meta">${r.genes.length}g · gen ${r.gen} · lin ${r.lineage}</span>`;
    el.onclick=()=>{ selSlot=g.rep.slot; draw(); };
    list.appendChild(el);
  }
}

// ---- circuit builder ----
const NODE_W=146,NODE_H=30,COLX=[122,432,742],SVGW=904;
function buildCircuit(genes,hideJunk){
  const em=new Map();
  for(const c of genes.map(decodeGene)){
    if(hideJunk&&c.junk) continue;
    const k=c.src+'>'+c.dst; let e=em.get(k);
    if(!e){ e={src:c.src,dst:c.dst,sum:0,count:0,junk:c.junk}; em.set(k,e); }
    e.sum+=c.w; e.count++;
  }
  const edges=[...em.values()];
  const used=new Set(); for(const e of edges){ used.add(e.src); used.add(e.dst); }
  const ids=[...used];
  // force-directed settle (matches the reference): repulsion + springs + weak
  // gravity (lets disconnected sub-circuits drift apart) + rect collision.
  // Deterministic golden-angle seed → same genome lays out the same way.
  const pos={}; ids.forEach((id,k)=>{ const a=k*2.39996,r=130+(k%3)*34; pos[id]={x:Math.cos(a)*r,y:Math.sin(a)*r,vx:0,vy:0,col:kindOf(id),i:id}; });
  const link=edges.filter(e=>e.src!==e.dst);
  for(let it=0;it<460;it++){ const al=Math.max(0.05,Math.pow(0.99,it)); const fx={},fy={}; ids.forEach(i=>{fx[i]=0;fy[i]=0;});
    for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++){ const i=ids[a],j=ids[b]; let dx=pos[i].x-pos[j].x,dy=pos[i].y-pos[j].y,d2=dx*dx+dy*dy+1,d=Math.sqrt(d2),f=17000/d2; dx/=d;dy/=d; fx[i]+=dx*f;fy[i]+=dy*f;fx[j]-=dx*f;fy[j]-=dy*f; }
    for(const e of link){ let dx=pos[e.dst].x-pos[e.src].x,dy=pos[e.dst].y-pos[e.src].y,dist=Math.hypot(dx,dy)+0.01,f=(dist-160)*0.04; dx/=dist;dy/=dist; fx[e.src]+=dx*f;fy[e.src]+=dy*f;fx[e.dst]-=dx*f;fy[e.dst]-=dy*f; }
    ids.forEach(i=>{ fx[i]+=-pos[i].x*0.004; fy[i]+=-pos[i].y*0.004; });
    ids.forEach(i=>{ const p=pos[i]; p.vx=(p.vx+fx[i]*al)*0.82; p.vy=(p.vy+fy[i]*al)*0.82; p.x+=Math.max(-22,Math.min(22,p.vx)); p.y+=Math.max(-22,Math.min(22,p.vy)); });
    for(let c=0;c<2;c++)for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++){ const pi=pos[ids[a]],pj=pos[ids[b]]; const dx=pj.x-pi.x,dy=pj.y-pi.y,ox=(NODE_W+20)-Math.abs(dx),oy=(NODE_H+18)-Math.abs(dy);
      if(ox>0&&oy>0){ if(ox<oy){ const s=(dx<0?-1:1)*ox/2; pi.x-=s;pj.x+=s; } else { const s=(dy<0?-1:1)*oy/2; pi.y-=s;pj.y+=s; } } }
  }
  const pad=48; let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; ids.forEach(i=>{ x0=Math.min(x0,pos[i].x);x1=Math.max(x1,pos[i].x);y0=Math.min(y0,pos[i].y);y1=Math.max(y1,pos[i].y); });
  ids.forEach(i=>{ pos[i].x+=-x0+NODE_W/2+pad; pos[i].y+=-y0+NODE_H/2+pad; });
  return {edges,pos,W:(x1-x0)+NODE_W+2*pad,H:(y1-y0)+NODE_H+2*pad};
}
function nodeEdgePt(cx,cy,ux,uy){ // where ray (ux,uy) leaves the node rect
  const tx=Math.abs(ux)<1e-6?1e9:(NODE_W/2+4)/Math.abs(ux), ty=Math.abs(uy)<1e-6?1e9:(NODE_H/2+4)/Math.abs(uy), t=Math.min(tx,ty);
  return [cx+ux*t, cy+uy*t];
}
function edgePath(s,d){
  if(s.i===d.i){ const x=s.x,y=s.y-NODE_H/2; return `M${x-7} ${y} C${x-46} ${y-38} ${x+46} ${y-38} ${x+7} ${y}`; }
  const dx=d.x-s.x,dy=d.y-s.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
  const a=nodeEdgePt(s.x,s.y,ux,uy), b=nodeEdgePt(d.x,d.y,-ux,-uy);
  const off=Math.min(42,len*0.16), mx=(a[0]+b[0])/2-uy*off, my=(a[1]+b[1])/2+ux*off;
  return `M${a[0]} ${a[1]} Q${mx} ${my} ${b[0]} ${b[1]}`;
}
function circuitSVG(genes){
  const C=buildCircuit(genes,hideJunk);
  if(!C.edges.length) return `<div class="empty">${hideJunk?'no meaningful connections — all junk &middot; toggle “hide junk” off to see them':'empty genome &middot; inert'}</div>`;
  const KH=['var(--sensor)','var(--internal)','var(--action)'];
  let s=`<svg class="circ-svg" viewBox="0 0 ${C.W} ${C.H}" preserveAspectRatio="xMidYMid meet" onmouseleave="this.classList.remove('dim')">`;
  s+=`<defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    ${['pos','neg','junk'].map((k,i)=>`<marker id="ar-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0.5 1 L9.5 5 L0.5 9 z" fill="${['var(--pos)','var(--neg)','#39435a'][i]}"/></marker>`).join('')}
  </defs>`;
  for(const e of C.edges){
    const s1=C.pos[e.src],d1=C.pos[e.dst]; if(!s1||!d1) continue;
    const path=edgePath(s1,d1), pos=e.sum>=0;
    const col=e.junk?'#39435a':(pos?'var(--pos)':'var(--neg)');
    const wdt=e.junk?1.1:(1.6+5*Math.min(1,Math.abs(e.sum)/MAXW));
    const mark=e.junk?'junk':(pos?'pos':'neg');
    s+=`<g class="edge${e.junk?' junk':''}" data-src="${e.src}" data-dst="${e.dst}" data-sum="${e.sum.toFixed(4)}"><title></title>`;
    s+=`<path class="base" d="${path}" fill="none" stroke="${col}" stroke-width="${wdt}" marker-end="url(#ar-${mark})" ${e.junk?'stroke-dasharray="3 5"':''}/>`;
    if(!e.junk) s+=`<path class="flow" d="${path}" fill="none" stroke="#eafff6" stroke-width="${Math.max(1,wdt*0.5)}" pathLength="1" stroke-dasharray="0.07 0.18" style="animation-delay:-${(Math.random()*1.4).toFixed(2)}s"/>`;
    const emx=e.src===e.dst?s1.x:(s1.x+d1.x)/2, emy=e.src===e.dst?(s1.y-NODE_H/2-32):(s1.y+d1.y)/2;
    if(e.count>1){
      s+=`<circle cx="${emx}" cy="${emy-2}" r="9" fill="#0b0f16" stroke="${col}" stroke-width="1.2"/>
          <text x="${emx}" y="${emy+1.3}" text-anchor="middle" fill="${col}" font-size="9.5" font-weight="700">×${e.count}</text>`; }
    s+=`<text class="wlabel" x="${emx}" y="${emy+(e.count>1?16:3.5)}" text-anchor="middle" fill="${col}" font-size="10" font-weight="600" paint-order="stroke" stroke="#06080c" stroke-width="3">${(e.sum>=0?'+':'')+e.sum.toFixed(2)}</text>`;
    s+=`</g>`;
  }
  for(const n in C.pos){ const p=C.pos[n], k=kindOf(p.i), col=KH[k], junk=!meaningful(p.i);
    const x=p.x-NODE_W/2,y=p.y-NODE_H/2;
    s+=`<g class="node-box${junk?' junk':''}" data-id="${p.i}" onmouseenter="hotNode(this,${p.i})" onmouseleave="this.closest('svg').classList.remove('dim')">
      <rect x="${x}" y="${y}" width="${NODE_W}" height="${NODE_H}" rx="6" fill="${junk?'#0c1119':'#0e1722'}"
        stroke="${junk?'#2a3346':col}" stroke-opacity="${junk?.6:.95}" stroke-width="${junk?1:1.4}" ${junk?'stroke-dasharray="3 3"':''}/>
      <circle cx="${x+9}" cy="${p.y}" r="2.4" fill="${junk?'#2a3346':col}"/>
      <text class="nt" x="${p.x+6}" y="${p.y+3.6}" text-anchor="middle" fill="${junk?'#5b6a80':'#cdd9e8'}"
        font-size="10.5" letter-spacing=".5" opacity="${junk?.55:1}">${NAMES[p.i]}</text></g>`;
  }
  return s+`</svg>`;
}
// per-tick: light up the connections actually carrying signal (output[src]*weight != 0) + firing nodes
function updateActivity(u){
  const svg=document.querySelector('#detail svg'); if(!svg) return;
  svg.classList.toggle('idle', !u);
  let act=0;
  svg.querySelectorAll('.edge').forEach(e=>{
    if(e.classList.contains('junk')){ e.classList.remove('active'); return; }
    const src=+e.getAttribute('data-src'), sum=+e.getAttribute('data-sum');
    const o = u ? u.o[src] : 0;
    const on = !!(u && (o===null || (o!==0 && sum!==0)));
    e.classList.toggle('active', on);
    const t=e.querySelector('title');
    if(t){ const sig=(o===null)?'diverged':(o*sum).toFixed(3); t.textContent=`weight ${sum} · signal ${sig}`; }
    if(on) act++;
  });
  svg.querySelectorAll('.node-box').forEach(n=>{
    const id=+n.getAttribute('data-id'), o = u ? u.o[id] : 0;
    n.classList.toggle('fire', !!(u && (o===null || o!==0)));
  });
  const ac=$('actcount'); if(ac) ac.textContent=act;
}
function hotNode(g,id){ const svg=g.closest('svg'); svg.classList.add('dim');
  svg.querySelectorAll('.hot').forEach(el=>el.classList.remove('hot')); g.classList.add('hot');
  svg.querySelectorAll('.edge').forEach(e=>{
    const a=+e.getAttribute('data-src'), b=+e.getAttribute('data-dst');
    if(a===id||b===id){ e.classList.add('hot');
      svg.querySelector(`.node-box[data-id="${a===id?b:a}"]`)?.classList.add('hot'); } });
}

function renderDetail(f){
  const sb=$('statbar'), d=$('detail');
  if(selSlot===null){ sb.innerHTML=''; $('dsel').textContent='';
    if(renderedKey!==null){ d.innerHTML='<div class="empty">click a unit on the map (or a genome) &middot; signal flows left &rarr; right</div>'; renderedKey=null; } return; }
  const u=selUnit(f);
  if(u){
    const key=u.genes.join(',');
    $('dsel').textContent='· slot '+u.slot+' · '+hashKey(key);
    if(renderedKey!==key){ d.innerHTML=circuitSVG(u.genes); renderedKey=key; }
    const mc=u.genes.map(decodeGene).filter(w=>!w.junk).length;
    sb.innerHTML=`<span class="pill">slot <b>${u.slot}</b></span><span class="pill">gen <b>${u.gen}</b></span>`+
      `<span class="pill">lineage <b>${u.lineage}</b></span><span class="pill">energy <b>${u.energy}</b></span>`+
      `<span class="pill"><b>${u.genes.length}</b> genes · <b>${mc}</b> meaningful</span>`+
      `<span class="pill">&#9889; <b id="actcount">0</b> connections active this tick</span>`;
    updateActivity(u);
  } else {
    $('dsel').textContent='· slot '+selSlot;
    sb.innerHTML=`<span class="pill dead">✕ slot ${selSlot} not alive at tick ${f.t} — scrub to when it lived</span>`;
    updateActivity(null);
  }
}

cv.onclick=(e)=>{ const f=curFrame(); if(!W||!f) return;
  const r=cv.getBoundingClientRect(), x=Math.floor((e.clientX-r.left)/px), y=Math.floor((e.clientY-r.top)/px);
  if(x<0||y<0||x>=W||y>=W) return;
  const u=f.units.find(u=>u.cell===y*W+x); if(u){ selSlot=u.slot; draw(); } };

async function poll(){
  try{
    const data=await(await fetch('/frames?since='+frames.length)).json();
    if(!W&&data.world){ W=data.world; every=data.sampleEvery; sizeCanvas(); $('meta').textContent=`${W}×${W} torus · every ${every} tick${every>1?'s':''}`; }
    if(data.frames.length) for(const fr of data.frames) frames.push(fr);
    done=data.done;
    if($('follow').checked&&!replaying&&frames.length) idx=frames.length-1;
    if(selSlot===null&&frames.length){ const lf=frames[frames.length-1];
      if(lf.units.length){ const top=[...groupGenomes(lf).values()].sort((a,b)=>b.n-a.n)[0]; if(top) selSlot=top.rep.slot; } }
    $('badge').className='badge '+(done?'ended':'live');
    $('badge').textContent=done?'ENDED · SCRUB':'LIVE · '+frames.length+'f';
    draw();
  }catch(e){ $('badge').textContent='waiting…'; }
  if(!done) setTimeout(poll,600);
}
$('slider').oninput=(e)=>{ idx=+e.target.value; $('follow').checked=false; draw(); };
$('showres').onchange=(e)=>{ showRes=e.target.checked; draw(); };
$('hidejunk').onchange=(e)=>{ hideJunk=e.target.checked; renderedKey=null; draw(); };
$('follow').onchange=(e)=>{ if(e.target.checked&&frames.length){ idx=frames.length-1; draw(); } };
$('play').onclick=()=>{ if(replaying){replaying=false;return;}
  replaying=true; $('follow').checked=false; idx=0;
  const step=()=>{ if(!replaying)return; draw(); idx++; if(idx>=frames.length){replaying=false;return;} setTimeout(step,1000/8); }; step(); };
poll();
</script></body></html>
