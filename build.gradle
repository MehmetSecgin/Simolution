plugins {
    id 'java'
    id 'checkstyle'
    id 'application'
    id 'com.diffplug.spotless' version '8.10.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

application {
    mainClass = 'com.simolution.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.github.luben:zstd-jni:1.5.6-9'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

checkstyle {
    toolVersion = '14.3.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        importOrder('\\#', 'java', 'javax', 'org', 'com', '')
        removeUnusedImports()
        eclipse('4.40').configFile('config/eclipse/formatter.xml')
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.register('bench', JavaExec) {
    mainClass = 'com.simolution.bench.Bench'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs '-Xmx4g'
}

tasks.register('observatory', JavaExec) {
    mainClass = 'com.simolution.observatory.Observatory'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs '-Xmx8g', '--enable-native-access=ALL-UNNAMED'
    args '--port', '8090', '--runs', 'runs'
}

if (project.hasProperty('noDebug')) {
    tasks.withType(JavaCompile).configureEach {
        options.debug = false
    }
}
